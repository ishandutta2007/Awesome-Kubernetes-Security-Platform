<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#000000" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid { stroke: #334155; stroke-width: 0.5; stroke-opacity: 0.4; }
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { r: 180px; opacity: 0.3; }
      50% { r: 240px; opacity: 0.6; }
      100% { r: 180px; opacity: 0.3; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-glow { animation: pulse 6s ease-in-out infinite; }
    .floating-element1 { animation: float1 5s ease-in-out infinite; }
    .floating-element2 { animation: float2 7s ease-in-out infinite; }
    .animated-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" class="bg" />

  <!-- Background Grid Pattern -->
  <g class="grid">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300" />
  </g>

  <!-- Dynamic Glowing Background Nodes -->
  <circle cx="950" cy="150" r="200" fill="url(#glow)" class="pulsing-glow" />
  <circle cx="200" cy="100" r="150" fill="url(#glow)" class="pulsing-glow" style="animation-delay: -3s;" />

  <!-- Dynamic Background Connection Streams -->
  <path d="M 150 220 Q 300 270 500 240 T 800 260 T 1100 210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="animated-stream" />
  <path d="M 100 80 Q 400 30 700 70 T 1150 40" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" class="animated-stream" style="animation-direction: reverse;" />

  <!-- Dynamic Geometric Accent Floating Shapes (Behind Text) -->
  <g class="floating-element1" opacity="0.25">
    <polygon points="980,50 1020,70 1000,110 960,90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="900" cy="220" r="30" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" />
  </g>
  
  <g class="floating-element2" opacity="0.25">
    <polygon points="150,50 180,80 130,90" fill="none" stroke="#c084fc" stroke-width="2" />
    <rect x="1050" y="180" width="40" height="40" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Shield Icon Graphic (Right Side Decorative) -->
  <g transform="translate(930, 75)" class="floating-element1" filter="url(#shadow)">
    <path d="M 75 0 L 140 30 V 90 C 140 135 75 170 75 170 C 75 170 10 135 10 90 V 30 L 75 0 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="4" />
    <path d="M 75 35 L 110 50 V 85 C 110 115 75 138 75 138 C 75 138 40 115 40 85 V 50 L 75 35 Z" fill="url(#accentGrad)" opacity="0.2" />
    <!-- Kubernetes Wheel Emblem inside Shield -->
    <circle cx="75" cy="85" r="22" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="75" cy="85" r="6" fill="#38bdf8" />
    <path d="M 75 63 V 53 M 75 107 V 117 M 53 85 H 43 M 97 85 H 107 M 59 69 L 52 62 M 91 101 L 98 108 M 59 101 L 52 108 M 91 69 L 98 62" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Content Container (Foreground Layer - High Z-index Visual Priority) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" class="badge-text">KUBERNETES SECURITY 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title" filter="url(#shadow)">
      Awesome Kubernetes Security
    </text>
    
    <!-- Gradient Bar under Title -->
    <rect x="0" y="148" width="460" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Tag Pills -->
    <g transform="translate(0, 218)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🛡️ CNAPP</text>

      <!-- Pill 2 -->
      <rect x="107" y="0" width="90" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="119" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#818cf8">⚡ eBPF</text>

      <!-- Pill 3 -->
      <rect x="209" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
      <text x="221" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🔒 DevSecOps</text>

      <!-- Pill 4 -->
      <rect x="326" y="0" width="95" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <text x="338" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#10b981">☸️ KSPM</text>
    </g>
  </g>
</svg>
